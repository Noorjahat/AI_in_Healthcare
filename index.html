<script type="text/babel">
const{useState,useEffect,useRef,useContext,createContext,useCallback,useMemo}=React;

/* ── CONFIGURATION ── */
const CONFIG = {
  GOOGLE_APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyhy-svxiGiAlAbU0FnSyy0DTM5Nf2BCPhxelQUlaQMTxCW83c3XX9xJc73xVkXaRKZZw/exec'
};

/* ── API CLIENT ── */
const api = {
  async call(action, data = {}) {
    if (!CONFIG.GOOGLE_APPS_SCRIPT_URL) throw new Error('Backend URL not configured. Please set it in CONFIG.');
    const resp = await fetch(CONFIG.GOOGLE_APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Avoid CORS preflight
      body: JSON.stringify({ action, data })
    });
    if (!resp.ok) throw new Error('Network error. Please try again.');
    const result = await resp.json();
    if (!result.success) throw new Error(result.message || 'Request failed');
    return result;
  },
  register(d) { return this.call('register', d); },
  login(d) { return this.call('login', d); },
  getProfile(d) { return this.call('getProfile', d); },
  updateProfile(d) { return this.call('updateProfile', d); },
  addHealthReading(d) { return this.call('addHealthReading', d); },
  getHealthReadings(d) { return this.call('getHealthReadings', d); },
  getAlerts(d) { return this.call('getAlerts', d); },
  resolveAlert(d) { return this.call('resolveAlert', d); },
  deleteAlert(d) { return this.call('deleteAlert', d); },
  getReports(d) { return this.call('getReports', d); },
  generateReport(d) { return this.call('generateReport', d); }
};

/* ── CONSTANTS ── */
const NAV=[
  {id:'dashboard',label:'Dashboard',icon:'home'},
  {id:'monitoring',label:'Live Monitoring',icon:'activity'},
  {id:'analysis',label:'AI Risk Analysis',icon:'brain'},
  {id:'trends',label:'Health Trends',icon:'trendingUp'},
  {id:'alerts',label:'Alerts',icon:'bell'},
  {id:'history',label:'Health History',icon:'clock'},
  {id:'assistant',label:'AI Assistant',icon:'messageCircle'},
  {id:'reports',label:'Reports',icon:'fileText'},
  {id:'profile',label:'Profile',icon:'user'},
  {id:'settings',label:'Settings',icon:'settings'}
];

/* ── UTILITIES ── */
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const fD=d=>new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const fT=d=>new Date(d).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
const fDT=d=>fD(d)+' '+fT(d);

function calcRisk(v){
  if(!v || !v.heartRate) return {score:0, level:'NO DATA', color:'#94a3b8', factors:[], conf:0};
  let s=0;const f=[];
  if(v.heartRate>100){s+=25;f.push('Elevated heart rate ('+v.heartRate+' BPM)')}else if(v.heartRate>90){s+=10;f.push('Slightly elevated heart rate')}else if(v.heartRate<50){s+=20;f.push('Low heart rate')}
  if(v.spo2<90){s+=30;f.push('Critically low SpO2 ('+v.spo2+'%)')}else if(v.spo2<95){s+=15;f.push('Low SpO2 ('+v.spo2+'%)')}
  if(v.temperature>38.5){s+=25;f.push('High temperature ('+v.temperature+'°C)')}else if(v.temperature>37.5){s+=10;f.push('Slightly elevated temperature')}
  if(v.systolicBP>140||v.diastolicBP>90){s+=25;f.push('High BP ('+v.systolicBP+'/'+v.diastolicBP+')')}else if(v.systolicBP>130||v.diastolicBP>85){s+=10;f.push('Slightly elevated BP')}
  if(v.age>60)s+=10;else if(v.age>45)s+=5;
  s=Math.min(100,Math.max(0,s));
  let lv,col;
  if(s<=20){lv='NORMAL';col='#10b981'}else if(s<=40){lv='MONITOR';col='#f59e0b'}else if(s<=60){lv='ATTENTION REQUIRED';col='#f97316'}else{lv='HIGH RISK';col='#ef4444'}
  return{score:s,level:lv,color:col,factors:f,conf:Math.floor(72+R(0,23))};
}

function gStat(v,val){
  const r={heartRate:[60,100],spo2:[95,100],temperature:[36.1,37.5],systolicBP:[90,140],diastolicBP:[60,90]};
  const rng=r[v];return rng?(val>=rng[0]&&val<=rng[1]?'normal':'abnormal'):'normal';
}

function simRead(){
  const abnormal = Math.random() < 0.18;
  let hr=RI(62,88), sp=RI(95,99), tmp=+(36.2+R(0,1)).toFixed(1), sys=RI(110,135), dia=RI(70,88);
  if(abnormal){
    const t=RI(0,3);
    if(t===0)hr=RI(100,130);
    else if(t===1)sp=RI(88,94);
    else if(t===2)tmp=+(37.8+R(0,1.5)).toFixed(1);
    else{sys=RI(140,170);dia=RI(95,110);}
  }
  return {heartRate:hr,spo2:sp,temperature:tmp,systolicBP:sys,diastolicBP:dia};
}

const mapReading = (r) => ({
  id: r.readingId,
  ts: new Date(r.timestamp).getTime(),
  date: fD(r.timestamp),
  time: fT(r.timestamp),
  heartRate: r.heartRate,
  spo2: r.spo2,
  temperature: r.temperature,
  systolicBP: r.systolicBP,
  diastolicBP: r.diastolicBP
});

const mapAlert = (a) => ({
  id: a.alertId,
  type: a.message,
  sev: a.severity,
  val: a.value,
  ts: new Date(a.timestamp).getTime(),
  status: a.status,
  message: a.message,
  reading: { id: a.readingId }
});

function expCSV(data,fn){
  if(!data.length)return;
  const h=Object.keys(data[0]);
  const csv=[h.join(','),...data.map(r=>h.map(k=>'"'+(r[k]??'')+'"').join(','))].join('\n');
  const b=new Blob([csv],{type:'text/csv'});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=fn;a.click();URL.revokeObjectURL(u);
}

const KB=[
  {kw:['spo2','oxygen','saturation'],ans:'SpO2 (Peripheral Capillary Oxygen Saturation) measures the percentage of hemoglobin binding sites occupied by oxygen. Normal values are 95-100%. Below 95% may indicate hypoxemia; below 90% is clinically significant. Measured non-invasively via pulse oximeter, typically on a fingertip.'},
  {kw:['heart rate','heartbeat','pulse','bpm'],ans:'Heart rate is beats per minute. Normal resting HR for adults: 60-100 BPM. Athletes may have 40-60 BPM. Tachycardia is >100 BPM at rest; bradycardia is <60 BPM. Factors include age, fitness, temperature, emotions, and medications.'},
  {kw:['blood pressure','bp','hypertension','systolic','diastolic'],ans:'Blood pressure is force of blood on artery walls — systolic/diastolic. Normal: <120/80. Elevated: 120-129/<80. Stage 1 HTN: 130-139/80-89. Stage 2 HTN: ≥140/≥90. Crisis: >180/>120. Often symptomless — called the "silent killer."'},
  {kw:['temperature','fever','hypothermia','celsius'],ans:'Normal body temperature: 36.5-37.5°C (97.7-99.5°F). Fever >38°C (100.4°F). Hyperthermia >40°C is emergency. Hypothermia <35°C requires emergency care. Temperature varies by time of day — lowest early morning, highest late afternoon.'},
  {kw:['risk','score','analysis'],ans:'Health risk assessment evaluates multiple vitals against normal ranges. Our rule-based algorithm scores deviations 0-100. Levels: NORMAL (0-20), MONITOR (21-40), ATTENTION (41-60), HIGH RISK (61-100). This is educational only — not a medical diagnosis.'},
  {kw:['monitoring','vitals','track'],ans:'Continuous monitoring tracks physiological parameters in real-time, enabling early detection of abnormalities. Key vitals: heart rate, SpO2, temperature, blood pressure. Modern systems alert when readings exceed thresholds for timely intervention.'},
  {kw:['ecg','ekg'],ans:'An ECG records heart electrical activity. It detects arrhythmias, myocardial infarction, heart block. Standard 12-lead ECG provides 12 views. Key components: P wave (atrial depolarization), QRS complex (ventricular depolarization), T wave (ventricular repolarization).'},
  {kw:['alert','notification','abnormal','warning'],ans:'Alerts trigger when vitals exceed thresholds. Severity: Warning (mild deviation) and Critical (significant deviation, immediate attention). Thresholds: HR>100, SpO2<95%, Temp>37.5°C, BP>140/90. Alerts enable proactive health management.'}
];

function chatResp(msg){
  const l=msg.toLowerCase();
  for(const e of KB)if(e.kw.some(k=>l.includes(k)))return e.ans;
  if(l.match(/hello|hi|hey/))return'Hello! I am your AI Health Information Assistant. Ask me about SpO2, heart rate, blood pressure, temperature, risk assessment, or monitoring concepts!';
  if(l.includes('thank'))return"You're welcome! Remember, for specific medical concerns, consult a healthcare professional.";
  if(l.includes('help'))return'I can help with: SpO2, heart rate, blood pressure, temperature, risk assessment, vital sign monitoring, ECG basics, and health alerts. Just ask!';
  return"I can provide general educational information about health vitals and monitoring. Try asking about SpO2, heart rate, blood pressure, or temperature. Note: I cannot diagnose or prescribe — always consult a healthcare professional.";
}

/* ── CONTEXT ── */
const Ctx=createContext();
function Provider({children}){
  const[page,setPage]=useState('landing');
  const[auth,setAuth]=useState(()=>{try{return JSON.parse(sessionStorage.getItem('hc_auth'))}catch{return null}});
  const[profile,setProfile]=useState(null);
  const[readings,setReadings]=useState([]);
  const[alerts,setAlerts]=useState([]);
  const[reports,setReports]=useState([]);
  const[loading,setLoading]=useState(false);
  const[toasts,setToasts]=useState([]);
  const[dark,setDark]=useState(false);
  const[sidebar,setSidebar]=useState(true);
  const[notifs,setNotifs]=useState(true);

  const toast=useCallback((m,t='info')=>{const id=Date.now()+Math.random();setToasts(p=>[...p,{id,m,t}]);setTimeout(()=>setToasts(p=>p.filter(x=>x.id!==id)),3500)},[]);
  const nav=useCallback(p=>{setPage(p);window.scrollTo(0,0)},[]);

  const refreshAll=useCallback(async()=>{
    if(!auth?.userId)return;
    setLoading(true);
    try{
      const[p,r,a,reps]=await Promise.all([
        api.getProfile({userId:auth.userId}),
        api.getHealthReadings({userId:auth.userId}),
        api.getAlerts({userId:auth.userId}),
        api.getReports({userId:auth.userId})
      ]);
      setProfile(p.data);
      setReadings((r.data||[]).map(mapReading));
      setAlerts((a.data||[]).map(mapAlert));
      setReports(reps.data||[]);
    }catch(e){toast(e.message,'error')}
    setLoading(false);
  },[auth,toast]);

  useEffect(()=>{
    if(auth?.userId){refreshAll()}
    else{setProfile(null);setReadings([]);setAlerts([]);setReports([])}
  },[auth,refreshAll]);

  const login=useCallback(async(email,password)=>{
    setLoading(true);
    try{
      const res=await api.login({email,password});
      sessionStorage.setItem('hc_auth',JSON.stringify(res.data));
      setAuth(res.data);
      nav('dashboard');
      toast('Welcome back!','success');
    }catch(e){toast(e.message,'error')}
    setLoading(false);
  },[nav,toast]);

  const logout=useCallback(()=>{
    sessionStorage.removeItem('hc_auth');
    setAuth(null);
    nav('landing');
    toast('Logged out','info');
  },[nav,toast]);

  const resolveAlert=async(id)=>{
    try{await api.resolveAlert({userId:auth.userId,alertId:id});setAlerts(p=>p.map(a=>a.id===id?{...a,status:'resolved'}:a));toast('Alert resolved','success')}catch(e){toast(e.message,'error')}
  };
  const delAlert=async(id)=>{
    try{await api.deleteAlert({userId:auth.userId,alertId:id});setAlerts(p=>p.filter(a=>a.id!==id));toast('Alert archived','info')}catch(e){toast(e.message,'error')}
  };

  const val={page,nav,auth,login,logout,profile,setProfile,readings,setReadings,alerts,setAlerts,reports,setReports,loading,setLoading,toasts,toast,dark,setDark,sidebar,setSidebar,notifs,setNotifs,refreshAll,resolveAlert,delAlert};
  return React.createElement(Ctx.Provider,{value:val},children);
}

/* ── CHART ── */
function Ch({type='line',data,options,h=200}){
  const ref=useRef(null),ch=useRef(null);
  useEffect(()=>{
    if(!ref.current)return;
    if(ch.current)ch.current.destroy();
    ch.current=new Chart(ref.current,{type,data,options:{...options,responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},...(options?.plugins||{})}}});
    return()=>{if(ch.current){ch.current.destroy();ch.current=null}};
  },[type,JSON.stringify(data),JSON.stringify(options)]);
  return <div style={{height:h}}><canvas ref={ref}/></div>;
}

/* ── CIRCULAR PROGRESS ── */
function Circ({val,sz=130,sw=10,col='#0d9488',lbl=''}){
  const r=(sz-sw)/2,c=r*2*Math.PI,o=c-(Math.min(100,Math.max(0,val))/100)*c;
  return <svg width={sz} height={sz} className="block mx-auto"><circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke="#e2e8f0" strokeWidth={sw}/><circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke={col} strokeWidth={sw} strokeDasharray={c} strokeDashoffset={o} strokeLinecap="round" transform={`rotate(-90 ${sz/2} ${sz/2})`} style={{transition:'stroke-dashoffset 1s ease'}}/><text x={sz/2} y={sz/2-6} textAnchor="middle" dominantBaseline="central" fontSize="28" fontWeight="800" fill={col}>{val}</text>{lbl&&<text x={sz/2} y={sz/2+16} textAnchor="middle" dominantBaseline="central" fontSize="11" fontWeight="500" fill="#64748b">{lbl}</text>}</svg>;
}

        <div><label className="text-xs font-semibold text-slate-700 mb-1 block">Weight (kg) *</label><input type="number" value={f.weight} onChange={e=>set('weight',e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 text-sm outline-none"/></div>
        <div><label className="text-xs font-semibold text-slate-700 mb-1 block">Contact</label><input type="tel" value={f.contact} onChange={e=>set('contact',e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 text-sm outline-none"/></div>

/* ════════════════════════════════════════════════════════
   PAGE: DASHBOARD
   ════════════════════════════════════════════════════════ */
function DashboardPage(){
  const{readings,alerts,nav,profile}=useContext(Ctx);
  if(readings.length===0){
    return <EmptyState icon="activity" title="No Health Data Available Yet" desc="Start monitoring or add your health readings to begin analysis." btnLabel="Start Monitoring" btnAction={()=>nav('monitoring')} />;
  }
  const cv=readings[0];
  const risk=calcRisk({...cv,age:parseInt(profile?.age||25)});
  const aa=alerts.filter(a=>a.status==='active').slice(0,3);
  const rh=readings.slice(0,5);
  const lu=readings.length?fT(cv.ts):'Now';
  const hs=Math.max(0,100-risk.score);
  return <div className="space-y-6 anim-fade">
    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
      <VCard icon="heart" color="text-red-500" bg="bg-red-50" label="Heart Rate" value={cv.heartRate} unit="BPM" status={gStat('heartRate',cv.heartRate)} trend={Math.round((Math.random()-.5)*8)} lastUp={lu} delay={0}/>
      <VCard icon="droplets" color="text-blue-500" bg="bg-blue-50" label="SpO2" value={cv.spo2} unit="%" status={gStat('spo2',cv.spo2)} trend={Math.round((Math.random()-.5)*3)} lastUp={lu} delay={1}/>
      <VCard icon="thermometer" color="text-amber-500" bg="bg-amber-50" label="Temperature" value={cv.temperature} unit="°C" status={gStat('temperature',cv.temperature)} trend={Math.round((Math.random()-.5)*4)} lastUp={lu} delay={2}/>
      <VCard icon="activity" color="text-primary-600" bg="bg-primary-50" label="Blood Pressure" value={cv.systolicBP+'/'+cv.diastolicBP} unit="mmHg" status={gStat('systolicBP',cv.systolicBP)} trend={Math.round((Math.random()-.5)*6)} lastUp={lu} delay={3}/>
    </div>
    <div className="grid lg:grid-cols-3 gap-4">
      <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100"><h3 className="text-sm font-bold text-slate-900 mb-4">Health Score</h3><Circ val={hs} col={risk.color} lbl={risk.level}/><div className="mt-4 text-center"><p className="text-xs text-slate-500">Risk Score: <span className="font-bold" style={{color:risk.color}}>{risk.score}/100</span></p></div></div>
      <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100"><h3 className="text-sm font-bold text-slate-900 mb-4">Overall Status</h3><div className="flex items-center gap-3 mb-4"><div className={`w-3 h-3 rounded-full ${hs>=80?'bg-emerald-500':hs>=60?'bg-amber-500':'bg-red-500'} pulse-live`}/><span className={`text-lg font-bold ${hs>=80?'text-emerald-700':hs>=60?'text-amber-700':'text-red-700'}`}>{hs>=80?'Good':hs>=60?'Fair':'Needs Attention'}</span></div><div className="space-y-3">{[{l:'Heart Rate',v:cv.heartRate+' BPM',ok:gStat('heartRate',cv.heartRate)==='normal'},{l:'SpO2',v:cv.spo2+'%',ok:gStat('spo2',cv.spo2)==='normal'},{l:'Temperature',v:cv.temperature+'°C',ok:gStat('temperature',cv.temperature)==='normal'},{l:'Blood Pressure',v:cv.systolicBP+'/'+cv.diastolicBP,ok:gStat('systolicBP',cv.systolicBP)==='normal'}].map((s,i)=><div key={i} className="flex items-center justify-between"><span className="text-xs text-slate-500">{s.l}</span><div className="flex items-center gap-2"><span className="text-xs font-semibold text-slate-700">{s.v}</span><span className={`w-2 h-2 rounded-full ${s.ok?'bg-emerald-500':'bg-red-500'}`}/></div></div>)}</div><button onClick={()=>nav('monitoring')} className="mt-4 w-full py-2 bg-primary-50 hover:bg-primary-100 text-primary-700 font-semibold rounded-xl text-sm transition flex items-center justify-center gap-2"><Ic name="activity" s={14}/>Start Monitoring</button></div>
      <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100"><div className="flex items-center justify-between mb-4"><h3 className="text-sm font-bold text-slate-900">Recent Alerts</h3><button onClick={()=>nav('alerts')} className="text-xs text-primary-600 font-medium">View All</button></div>{aa.length?aa.map(a=><div key={a.id} className={`flex items-start gap-3 p-3 rounded-xl mb-2 ${a.sev==='critical'?'bg-red-50':'bg-amber-50'}`}><Ic name="alertTriangle" s={16} cn={a.sev==='critical'?'text-red-500':'text-amber-500'}/><div><p className="text-xs font-semibold text-slate-900">{a.type}</p><p className="text-[10px] text-slate-500">{a.val} | {fDT(a.ts)}</p></div></div>):<p className="text-sm text-slate-400 text-center py-8">No active alerts</p>}</div>
    </div>
    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100"><div className="flex items-center justify-between mb-4"><h3 className="text-sm font-bold text-slate-900">Recent Measurements</h3><button onClick={()=>nav('history')} className="text-xs text-primary-600 font-medium">View All</button></div><div className="overflow-x-auto"><table className="w-full text-xs"><thead><tr className="text-slate-500 border-b border-slate-100"><th className="py-2 text-left font-semibold">Time</th><th className="py-2 text-right font-semibold">HR</th><th className="py-2 text-right font-semibold">SpO2</th><th className="py-2 text-right font-semibold">Temp</th><th className="py-2 text-right font-semibold">BP</th></tr></thead><tbody>{rh.map((h,i)=><tr key={i} className="border-b border-slate-50"><td className="py-2 text-slate-600">{h.time}</td><td className={`py-2 text-right font-semibold ${h.heartRate>100?'text-red-600':'text-slate-700'}`}>{h.heartRate}</td><td className={`py-2 text-right font-semibold ${h.spo2<95?'text-red-600':'text-slate-700'}`}>{h.spo2}%</td><td className={`py-2 text-right font-semibold ${h.temperature>37.5?'text-red-600':'text-slate-700'}`}>{h.temperature}°C</td><td className="py-2 text-right font-semibold text-slate-700">{h.systolicBP}/{h.diastolicBP}</td></tr>)}</tbody></table></div></div>
  </div>;
}

/* ════════════════════════════════════════════════════════
   PAGE: LIVE MONITORING
   ════════════════════════════════════════════════════════ */
function LiveMonitoringPage(){
  const{auth,toast,readings,setReadings,alerts,setAlerts,refreshAll}=useContext(Ctx);
  const[mon,setMon]=useState(false);const[pau,setPau]=useState(false);
  const[v,setV]=useState({heartRate:0,spo2:0,temperature:0,systolicBP:0,diastolicBP:0});
  const[hrD,setHrD]=useState([]);const[abn,setAbn]=useState(null);
  const iRef=useRef(null);

  const generateAndSave=async()=>{
    const reading=simRead();
    setV(reading);
    setHrD(d=>[...d.slice(-29),{x:fT(Date.now()),y:reading.heartRate}]);
    const msgs=[];
    if(reading.heartRate>100)msgs.push('High HR');
    if(reading.spo2<95)msgs.push('Low SpO2');
    if(reading.temperature>37.8)msgs.push('High Temp');
    if(reading.systolicBP>140)msgs.push('High BP');
    setAbn(msgs.length?msgs.join(', '):null);
    
    try{
      const res=await api.addHealthReading({userId:auth.userId,...reading});
      const newReading=mapReading(res.data.reading);
      setReadings(prev=>[newReading,...prev]);
      if(res.data.alerts&&res.data.alerts.length>0){
        const newAlerts=res.data.alerts.map(mapAlert);
        setAlerts(prev=>[...newAlerts,...prev]);
        newAlerts.forEach(a=>toast(a.message,a.severity==='critical'?'error':'warning'));
      }
    }catch(err){toast('Failed to save reading: '+err.message,'error');}
  };

  useEffect(()=>{
    if(mon&&!pau){
      generateAndSave();
      iRef.current=setInterval(generateAndSave,4000);
    }else{
      clearInterval(iRef.current);
    }
    return()=>clearInterval(iRef.current);
  },[mon,pau]);

  const stop=()=>{setMon(false);setPau(false);toast('Monitoring stopped. Data saved to history.','info');refreshAll();};
  
  const mkC=(d,l,c,yMin,yMax)=>({type:'line',data:{labels:d.map(x=>x.x),datasets:[{label:l,data:d.map(x=>x.y),borderColor:c,backgroundColor:c+'20',borderWidth:2,fill:true,tension:.4,pointRadius:0}]},options:{scales:{y:{min:yMin,max:yMax,grid:{color:'#f1f5f9'},ticks:{font:{size:10}}},x:{display:false}},animation:{duration:0},plugins:{tooltip:{enabled:true}}}});
  
  return <div className="space-y-6 anim-fade">
    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100"><div className="flex flex-wrap items-center justify-between gap-4">
      <div className="flex items-center gap-3">{!mon?<button onClick={()=>{setMon(true);setPau(false);toast('Monitoring started','success')}} className="px-5 py-2.5 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl text-sm flex items-center gap-2 transition"><Ic name="play" s={16}/>Start Monitoring</button>:<>{!pau?<button onClick={()=>{setPau(true);toast('Monitoring paused','warning')}} className="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-semibold rounded-xl text-sm flex items-center gap-2 transition"><Ic name="pause" s={16}/>Pause</button>:<button onClick={()=>{setPau(false);toast('Monitoring resumed','info')}} className="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold rounded-xl text-sm flex items-center gap-2 transition"><Ic name="play" s={16}/>Resume</button>}<button onClick={stop} className="px-5 py-2.5 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-xl text-sm flex items-center gap-2 transition"><Ic name="square" s={16}/>Stop</button></>}</div>
      <div className="flex items-center gap-4">{mon&&<div className="flex items-center gap-2"><span className={`w-2.5 h-2.5 rounded-full ${pau?'bg-amber-500':'bg-emerald-500'} ${pau?'':'pulse-live'}`}/><span className="text-xs font-medium text-slate-600">{pau?'Paused':'Live'}</span></div>}</div>
    </div>{abn&&<div className="mt-4 flex items-center gap-2 px-4 py-2.5 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700 font-medium anim-fade"><Ic name="alertTriangle" s={16} cn="text-red-500"/>Abnormal: {abn}</div>}<p className="mt-3 text-[10px] text-slate-400 flex items-center gap-1"><Ic name="info" s={12}/>Simulated Sensor Data — Values generated locally for demonstration and saved to your account.</p></div>

    <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">{[{l:'Heart Rate',v:v.heartRate,u:'BPM',s:gStat('heartRate',v.heartRate)},{l:'SpO2',v:v.spo2,u:'%',s:gStat('spo2',v.spo2)},{l:'Temperature',v:v.temperature,u:'°C',s:gStat('temperature',v.temperature)},{l:'Systolic BP',v:v.systolicBP,u:'mmHg',s:gStat('systolicBP',v.systolicBP)},{l:'Diastolic BP',v:v.diastolicBP,u:'mmHg',s:gStat('diastolicBP',v.diastolicBP)}].map((m,i)=><div key={i} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100"><p className="text-[10px] text-slate-500 font-medium">{m.l}</p><div className="flex items-end gap-1 mt-1"><span className="text-xl font-bold text-slate-900">{m.v||'--'}</span><span className="text-xs text-slate-400">{m.u}</span></div><span className={`text-[9px] font-semibold ${m.s==='normal'?'text-emerald-600':'text-red-600'}`}>{v.heartRate?m.s:'--'}</span></div>)}</div>

    <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100"><h3 className="text-sm font-bold text-slate-900 mb-3">Heart Rate (BPM)</h3>{hrD.length?<Ch type="line" data={mkC(hrD,'HR','#ef4444',40,180).data} options={mkC(hrD,'HR','#ef4444',40,180).options} h={180}/>:<p className="text-sm text-slate-400 text-center py-12">Start monitoring to see live data</p>}</div>
  </div>;
}

/* ════════════════════════════════════════════════════════
   PAGE: AI RISK ANALYSIS
   ════════════════════════════════════════════════════════ */
function AnalysisPage(){
  const{readings,profile,toast,nav}=useContext(Ctx);
  const cv=readings[0]||{heartRate:0,spo2:0,temperature:0,systolicBP:0,diastolicBP:0};
  const[f,setF]=useState({age:profile?.age||25,heartRate:cv.heartRate,spo2:cv.spo2,temperature:cv.temperature,systolicBP:cv.systolicBP,diastolicBP:cv.diastolicBP});
  const[res,setRes]=useState(null);const[ld,setLd]=useState(false);const set=(k,v)=>setF(p=>({...p,[k]:+v}));
  const run=()=>{setLd(true);setTimeout(()=>{setRes(calcRisk(f));setLd(false);toast('Analysis complete','success')},1500)};
  const lb={NORMAL:'bg-emerald-50 text-emerald-700 border-emerald-200',MONITOR:'bg-amber-50 text-amber-700 border-amber-200','ATTENTION REQUIRED':'bg-orange-50 text-orange-700 border-orange-200','HIGH RISK':'bg-red-50 text-red-700 border-red-200'};
  
  if(readings.length===0){
    return <EmptyState icon="brain" title="Insufficient Health Data" desc="Start monitoring to collect health readings. AI risk analysis will be available once you have data." btnLabel="Start Monitoring" btnAction={()=>nav('monitoring')} />;
  }
  
  return <div className="space-y-6 anim-fade">
    <div className="bg-gradient-to-r from-primary-600 to-primary-700 rounded-2xl p-6 text-white"><h2 className="text-xl font-bold mb-1">AI Health Risk Analysis</h2><p className="text-sm text-primary-100">Enter or use current vitals to calculate an educational health risk score</p></div>
    <div className="grid lg:grid-cols-2 gap-6">
      <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100"><h3 className="text-sm font-bold text-slate-900 mb-4">Input Parameters</h3><div className="grid grid-cols-2 gap-4">{[{k:'age',l:'Age',u:'years'},{k:'heartRate',l:'Heart Rate',u:'BPM'},{k:'spo2',l:'SpO2',u:'%'},{k:'temperature',l:'Temperature',u:'°C'},{k:'systolicBP',l:'Systolic BP',u:'mmHg'},{k:'diastolicBP',l:'Diastolic BP',u:'mmHg'}].map(x=><div key={x.k}><label className="text-xs font-semibold text-slate-700 mb-1 block">{x.l}</label><input type="number" step={x.k==='temperature'?.1:1} value={f[x.k]} onChange={e=>set(x.k,e.target.value)} className="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 text-sm outline-none"/></div>)}</div><button onClick={run} disabled={ld} className="mt-6 w-full py-3 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl transition-all flex items-center justify-center gap-2 disabled:opacity-50">{ld?<><div className="spinner"/>Analyzing...</>:<><Ic name="brain" s={18}/>Analyze Health Risk</>}</button></div>
      <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100"><h3 className="text-sm font-bold text-slate-900 mb-4">Analysis Result</h3>{res?<div className="anim-up"><div className="flex items-center justify-center mb-6"><Circ val={res.score} sz={160} sw={14} col={res.color} lbl="Risk Score"/></div><div className={`text-center mb-6 px-4 py-2.5 rounded-xl border ${lb[res.level]||'bg-slate-50 text-slate-700 border-slate-200'}`}><span className="text-sm font-bold">{res.level}</span></div><div className="grid grid-cols-2 gap-4 mb-6"><div className="bg-slate-50 rounded-xl p-3 text-center"><p className="text-[10px] text-slate-500">Confidence</p><p className="text-lg font-bold text-slate-900">{res.conf}%</p></div><div className="bg-slate-50 rounded-xl p-3 text-center"><p className="text-[10px] text-slate-500">Factors</p><p className="text-lg font-bold text-slate-900">{res.factors.length}</p></div></div>{res.factors.length>0&&<div><p className="text-xs font-semibold text-slate-700 mb-2">Contributing Factors</p><div className="space-y-2">{res.factors.map((f,i)=><div key={i} className="flex items-start gap-2 p-2.5 bg-amber-50 rounded-lg"><Ic name="alertTriangle" s={14} cn="text-amber-500 mt-0.5 flex-shrink-0"/><span className="text-xs text-amber-800">{f}</span></div>)}</div></div>}<p className="mt-4 text-[10px] text-slate-400 leading-relaxed">This analysis is for educational purposes only and does not constitute a medical diagnosis.</p></div>:<p className="text-sm text-slate-400 text-center py-16">Enter parameters and click "Analyze Health Risk" to see results</p>}</div>
    </div>
  </div>;
}

/* ════════════════════════════════════════════════════════
   PAGE: HEALTH TRENDS
   ════════════════════════════════════════════════════════ */
function TrendsPage(){
  const{readings,nav}=useContext(Ctx);const[fil,setFil]=useState('7');
  if(readings.length<2){
    return <EmptyState icon="trendingUp" title="Not Enough Data" desc="You need at least 2 health readings to visualize trends. Start monitoring to collect data." btnLabel="Start Monitoring" btnAction={()=>nav('monitoring')} />;
  }
  const fd=useMemo(()=>{const d=fil==='1'?1:fil==='7'?7:30;const c=Date.now()-d*864e5;return readings.filter(h=>h.ts>=c)},[readings,fil]);
  const st=useMemo(()=>{if(!fd.length)return{};const c=k=>{const v=fd.map(h=>h[k]);return{avg:+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1),min:Math.min(...v),max:Math.max(...v),tr:v[v.length-1]-v[0]}};return{heartRate:c('heartRate'),spo2:c('spo2'),temperature:c('temperature'),systolicBP:c('systolicBP')}},[fd]);
  const mkD=(k)=>{const b={};fd.forEach(h=>{if(!b[h.date])b[h.date]={x:h.date,y:[]};b[h.date].y.push(h[k])});return Object.values(b).map(d=>({x:d.x,y:+(d.y.reduce((a,b)=>a+b,0)/d.y.length).toFixed(1)}))};
  const mkC=(d,l,c,yMin,yMax)=>({type:'line',data:{labels:d.map(x=>x.x),datasets:[{label:l,data:d.map(x=>x.y),borderColor:c,backgroundColor:c+'20',borderWidth:2,fill:true,tension:.3,pointRadius:2,pointBackgroundColor:c}]},options:{scales:{y:{min:yMin,max:yMax,grid:{color:'#f1f5f9'},ticks:{font:{size:10}}},x:{grid:{display:false},ticks:{font:{size:9},maxRotation:45}}},plugins:{tooltip:{enabled:true},legend:{display:false}}}});
  return <div className="space-y-6 anim-fade">
    <div className="flex flex-wrap items-center justify-between gap-4"><h2 className="text-lg font-bold text-slate-900">Health Trends</h2><div className="flex gap-2">{[{k:'1',l:'Today'},{k:'7',l:'7 Days'},{k:'30',l:'30 Days'}].map(f=><button key={f.k} onClick={()=>setFil(f.k)} className={`px-4 py-2 rounded-xl text-xs font-semibold transition ${fil===f.k?'bg-primary-600 text-white':'bg-white border border-slate-200 text-slate-600'}`}>{f.l}</button>)}</div></div>
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">{st.heartRate&&[{l:'Heart Rate',s:st.heartRate,u:'BPM'},{l:'SpO2',s:st.spo2,u:'%'},{l:'Temperature',s:st.temperature,u:'°C'},{l:'Systolic BP',s:st.systolicBP,u:'mmHg'}].map((v,i)=><div key={i} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100"><p className="text-xs text-slate-500 font-medium mb-2">{v.l}</p><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[9px] text-slate-400">Avg</p><p className="text-sm font-bold text-slate-900">{v.s.avg}</p></div><div><p className="text-[9px] text-slate-400">Min</p><p className="text-sm font-bold text-slate-900">{v.s.min}</p></div><div><p className="text-[9px] text-slate-400">Max</p><p className="text-sm font-bold text-slate-900">{v.s.max}</p></div></div><div className="flex items-center justify-center gap-1 mt-2"><Ic name={v.s.tr>0?"trendingUp":"trendingDown"} s={12} cn={v.s.tr>0?'text-red-500':'text-emerald-500'}/><span className={`text-xs font-semibold ${v.s.tr>0?'text-red-500':'text-emerald-500'}`}>{v.s.tr>0?'+':''}{v.s.tr.toFixed(1)} {v.u}</span></div></div>)}</div>
    <div className="grid md:grid-cols-2 gap-4">
      <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100"><h3 className="text-sm font-bold text-slate-900 mb-3">Heart Rate</h3><Ch {...mkC(mkD('heartRate'),'HR','#ef4444',50,150)} h={220}/></div>

/* ════════════════════════════════════════════════════════

function AlertsPage(){

/* ════════════════════════════════════════════════════════
   PAGE: HEALTH HISTORY
   ════════════════════════════════════════════════════════ */
function HistoryPage(){
  const{readings,toast,nav}=useContext(Ctx);const[search,setSearch]=useState('');const[sortCol,setSortCol]=useState('ts');const[sortDir,setSortDir]=useState(-1);const[dateFil,setDateFil]=useState('');const[vw,setVw]=useState(null);
  if(readings.length===0){
    return <EmptyState icon="clock" title="No Health History Yet" desc="Your monitoring readings will appear here once you start monitoring." btnLabel="Start Monitoring" btnAction={()=>nav('monitoring')} />;
  }
  const filtered=useMemo(()=>{let d=[...readings];if(search){const s=search.toLowerCase();d=d.filter(h=>h.date.includes(s)||h.time.includes(s)||(h.heartRate+'').includes(s))}if(dateFil)d=d.filter(h=>h.date.includes(dateFil));d.sort((a,b)=>{const av=a[sortCol],bv=b[sortCol];return(av>bv?1:av<bv?-1:0)*sortDir});return d.slice(0,100)},[readings,search,sortCol,sortDir,dateFil]);
  const rk=h=>calcRisk({...h,age:28});
  const doExport=()=>{const data=filtered.map(h=>({Date:h.date,Time:h.time,HeartRate:h.heartRate,SpO2:h.spo2,Temperature:h.temperature,SystolicBP:h.systolicBP,DiastolicBP:h.diastolicBP}));expCSV(data,'health_history.csv');toast('CSV exported','success')};
  const togSort=c=>{if(sortCol===c)setSortDir(d=>d*-1);else{setSortCol(c);setSortDir(-1)}};
  return <div className="space-y-6 anim-fade">
    <div className="flex flex-wrap items-center justify-between gap-4"><h2 className="text-lg font-bold text-slate-900">Health History</h2><button onClick={doExport} className="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl text-sm flex items-center gap-2 transition"><Ic name="download" s={16}/>Export CSV</button></div>
    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex flex-wrap gap-3 items-center"><div className="relative flex-1 min-w-[200px]"><Ic name="search" s={16} cn="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"/><input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search readings..." className="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 text-sm outline-none"/></div><input type="text" value={dateFil} onChange={e=>setDateFil(e.target.value)} placeholder="Filter by date..." className="px-4 py-2.5 rounded-xl border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 text-sm outline-none w-40"/></div>
    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-xs"><thead><tr className="bg-slate-50 border-b border-slate-100">{[{k:'date',l:'Date'},{k:'time',l:'Time'},{k:'heartRate',l:'HR'},{k:'spo2',l:'SpO2'},{k:'temperature',l:'Temp'},{k:'systolicBP',l:'BP'},{k:'ts',l:'Risk'}].map(c=><th key={c.k} onClick={()=>togSort(c.k)} className="py-3 px-3 text-left font-semibold text-slate-600 cursor-pointer hover:text-primary-600">{c.l} {sortCol===c.k&&(sortDir===1?'↑':'↓')}</th>)}<th className="py-3 px-3 text-left font-semibold text-slate-600">Actions</th></tr></thead>
    <tbody>{filtered.map((h,i)=>{const r=rk(h);return <tr key={h.id} className="border-b border-slate-50 hover:bg-slate-50/50"><td className="py-2.5 px-3 text-slate-600">{h.date}</td><td className="py-2.5 px-3 text-slate-600">{h.time}</td><td className={`py-2.5 px-3 font-semibold ${h.heartRate>100?'text-red-600':'text-slate-700'}`}>{h.heartRate}</td><td className={`py-2.5 px-3 font-semibold ${h.spo2<95?'text-red-600':'text-slate-700'}`}>{h.spo2}%</td><td className={`py-2.5 px-3 font-semibold ${h.temperature>37.5?'text-red-600':'text-slate-700'}`}>{h.temperature}°C</td><td className="py-2.5 px-3 font-semibold text-slate-700">{h.systolicBP}/{h.diastolicBP}</td><td className="py-2.5 px-3"><span className="text-[10px] font-bold px-1.5 py-0.5 rounded" style={{color:r.color,backgroundColor:r.color+'20'}}>{r.level}</span></td><td className="py-2.5 px-3"><button onClick={()=>setVw(h)} className="text-primary-600 hover:text-primary-700 font-medium">View</button></td></tr>})}</tbody></table></div></div>
    {vw&&<div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={()=>setVw(null)}><div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl anim-up" onClick={e=>e.stopPropagation()}><div className="flex items-center justify-between mb-4"><h3 className="text-lg font-bold text-slate-900">Reading Details</h3><button onClick={()=>setVw(null)} className="p-1 rounded-lg hover:bg-slate-100"><Ic name="x" s={18}/></button></div><div className="space-y-2">{Object.entries({Date:vw.date,Time:vw.time,'Heart Rate':vw.heartRate+' BPM',SpO2:vw.spo2+'%',Temperature:vw.temperature+'°C','Blood Pressure':vw.systolicBP+'/'+vw.diastolicBP+' mmHg'}).map(([k,v])=><p key={k} className="text-sm"><span className="font-semibold text-slate-700">{k}:</span> <span className="text-slate-600">{v}</span></p>)}</div></div></div>}
  </div>;
}

/* ════════════════════════════════════════════════════════

      <div className="p-4 border-t border-slate-100"><div className="flex flex-wrap gap-2 mb-3">{suggestions.map((s,i)=><button key={i} onClick={()=>{setInput(s)}} className="px-3 py-1.5 bg-primary-50 hover:bg-primary-100 text-primary-700 rounded-lg text-xs font-medium transition">{s}</button>)}</div><div className="flex gap-2"><input type="text" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Ask a health question..." className="flex-1 px-4 py-3 rounded-xl border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 text-sm outline-none"/><button onClick={send} className="px-5 py-3 bg-primary-600 hover:bg-primary-700 text-white rounded-xl transition-all flex items-center gap-2"><Ic name="send" s={16}/></button></div><p className="text-[10px] text-slate-400 mt-2">This assistant provides general educational information only. Not for medical diagnosis or prescriptions.</p></div>

  </div>;

/* ════════════════════════════════════════════════════════
   PAGE: REPORTS
   ════════════════════════════════════════════════════════ */
function ReportsPage(){
  const{auth,profile,readings,reports,toast,refreshAll,nav}=useContext(Ctx);
  const[ld,setLd]=useState(false);
  
  const handleGenerate=async()=>{
    if(readings.length===0){toast('No health data available to generate a report.','warning');return;}
    setLd(true);
    try{
      await api.generateReport({userId:auth.userId});
      toast('Report generated successfully!','success');
      refreshAll();
    }catch(e){toast(e.message,'error');}
    setLd(false);
  };
  
  if(readings.length===0){
    return <EmptyState icon="fileText" title="No Reports Available" desc="Start monitoring to collect health readings. Reports can be generated once you have data." btnLabel="Start Monitoring" btnAction={()=>nav('monitoring')} />;
  }
  
  return <div className="space-y-6 anim-fade">
    <div className="flex flex-wrap items-center justify-between gap-4 no-print"><h2 className="text-lg font-bold text-slate-900">Health Reports</h2><button onClick={handleGenerate} disabled={ld} className="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl text-sm flex items-center gap-2 transition disabled:opacity-50">{ld?<div className="spinner"/>:<><Ic name="plus" s={16}/>Generate Report</>}</button></div>

              <div className="text-right">
                <p className="text-xs text-slate-500">Risk Score</p>

              {r.summary&&r.summary.heartRate&&<div className="bg-slate-50 rounded-xl p-3"><p className="text-[10px] text-slate-500">Heart Rate (Avg)</p><p className="text-sm font-bold text-slate-900">{r.summary.heartRate.avg} BPM</p></div>}
              {r.summary&&r.summary.spo2&&<div className="bg-slate-50 rounded-xl p-3"><p className="text-[10px] text-slate-500">SpO2 (Avg)</p><p className="text-sm font-bold text-slate-900">{r.summary.spo2.avg}%</p></div>}
              {r.summary&&r.summary.temperature&&<div className="bg-slate-50 rounded-xl p-3"><p className="text-[10px] text-slate-500">Temp (Avg)</p><p className="text-sm font-bold text-slate-900">{r.summary.temperature.avg}°C</p></div>}
              {r.summary&&r.summary.systolicBP&&<div className="bg-slate-50 rounded-xl p-3"><p className="text-[10px] text-slate-500">Sys BP (Avg)</p><p className="text-sm font-bold text-slate-900">{r.summary.systolicBP.avg} mmHg</p></div>}
            </div>
            <div className="flex justify-between text-xs text-slate-500">
              <span>Period: {r.dateRange}</span>
              <span>Total Readings: {r.summary?.totalReadings||0}</span>

          </div>
        ))}
      </div>
    )}
  </div>;

    <div className="max-w-2xl mx-auto space-y-4">
      <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100"><h3 className="text-base font-bold text-slate-900 mb-4 flex items-center gap-2"><Ic name="info" s={18} cn="text-primary-600"/>Account Status</h3><div className="flex items-center justify-between py-2"><div><p className="text-sm font-medium text-slate-700">Backend Connection</p><p className="text-xs text-slate-500">{CONFIG.GOOGLE_APPS_SCRIPT_URL?'Connected to Google Apps Script':'Not configured'}</p></div><span className={`w-2.5 h-2.5 rounded-full ${CONFIG.GOOGLE_APPS_SCRIPT_URL?'bg-emerald-500':'bg-red-500'}`}/></div></div>

      <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100"><h3 className="text-base font-bold text-slate-900 mb-4 flex items-center gap-2"><Ic name="settings" s={18} cn="text-primary-600"/>Appearance</h3><div className="flex items-center justify-between py-3"><div><p className="text-sm font-medium text-slate-700">Dark Mode</p><p className="text-xs text-slate-500">Switch to dark theme</p></div><Toggle on={dark} onToggle={()=>{setDark(!dark);toast('Theme toggled','info')}}/></div></div>

      <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100"><h3 className="text-base font-bold text-slate-900 mb-4 flex items-center gap-2"><Ic name="bell" s={18} cn="text-primary-600"/>Notifications</h3><div className="space-y-1">{[{k:'emailNotifs',l:'Email Notifications',d:'Receive alerts via email'},{k:'pushNotifs',l:'Push Notifications',d:'Browser push notifications'},{k:'soundAlerts',l:'Sound Alerts',d:'Play sound on critical alerts'}].map(s=><div key={s.k} className="flex items-center justify-between py-3"><div><p className="text-sm font-medium text-slate-700">{s.l}</p><p className="text-xs text-slate-500">{s.d}</p></div><Toggle on={settings[s.k]} onToggle={()=>tog(s.k)}/></div>)}</div></div>

      <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100"><h3 className="text-base font-bold text-slate-900 mb-4 flex items-center gap-2"><Ic name="shield" s={18} cn="text-primary-600"/>Privacy & Data</h3><div className="space-y-1">{[{k:'dataShare',l:'Data Sharing',d:'Share anonymized data for research'},{k:'analytics',l:'Usage Analytics',d:'Help improve the application'}].map(s=><div key={s.k} className="flex items-center justify-between py-3"><div><p className="text-sm font-medium text-slate-700">{s.l}</p><p className="text-xs text-slate-500">{s.d}</p></div><Toggle on={settings[s.k]} onToggle={()=>tog(s.k)}/></div>)}</div><div className="mt-4 p-3 bg-emerald-50 rounded-xl text-xs text-emerald-800 flex items-start gap-2"><Ic name="check" s={14} cn="text-emerald-600 mt-0.5 flex-shrink-0"/><span>Your health data is securely stored in your own Google Sheet and is isolated to your account.</span></div></div>
    </div>
  </div>;
}

/* ════════════════════════════════════════════════════════
   APP
   ════════════════════════════════════════════════════════ */
function App(){
  return <Provider><AppInner/></Provider>;
}

function AppInner(){
  const{page,auth,profile,loading}=useContext(Ctx);
  
  if (!auth) {
    const P = page === 'register' ? RegisterPage : (page === 'login' ? LoginPage : LandingPage);
    return <><P/><Toasts/></>;
  }
  
  if (loading && !profile) {
    return <div className="min-h-screen flex items-center justify-center"><div className="spinner" style={{width:40,height:40,borderWidth:4}}/></div>;
  }
  
  if (profile && !profile.profileCompleted) {
    return <><ProfileSetupPage/><Toasts/></>;
  }
  
  const pages = {dashboard:DashboardPage,monitoring:LiveMonitoringPage,analysis:AnalysisPage,trends:TrendsPage,alerts:AlertsPage,history:HistoryPage,assistant:AssistantPage,reports:ReportsPage,profile:ProfilePage,settings:SettingsPage};
  const P = pages[page] || DashboardPage;
  return (
    <div className="flex min-h-screen">
      <Sidebar/>
      <div className="flex-1 flex flex-col min-w-0">
        <Header/>
        <main className="flex-1 p-4 lg:p-6 overflow-y-auto">
          <P/>
        </main>
      </div>
      <Toasts/>
    </div>
  );
}

/* ── RENDER ── */
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
